name: Build EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      # ⭐ 从 tag 提取版本号，补齐三段式，用 Node.js 写入 package.json
      - name: Update version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Write-Host "Tag: $tag"

          # 去掉前缀 v
          $version = $tag -replace '^v', ''

          # 按 . 分割
          $parts = $version -split '\.'

          # 补齐或截断为 3 段
          while ($parts.Length -lt 3) {
            $parts += '0'
          }
          if ($parts.Length -gt 3) {
            $parts = $parts[0..2]
          }

          # 重新拼成三段式
          $version = $parts -join '.'
          Write-Host "New version: $version"

          # 用 Node.js 写入 package.json（保留中文，不加 BOM）
          node -e "const fs=require('fs');const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));pkg.version='$version';fs.writeFileSync('package.json',JSON.stringify(pkg,null,2),'utf8');"

          Write-Host "--- package.json version ---"
          Get-Content package.json | Select-String '"version"'
          Write-Host "--- artifactName ---"
          Get-Content package.json | Select-String 'artifactName'

      - name: Build EXE
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lx-quality-tester-exe
          path: dist/*.exe
          retention-days: 30

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
