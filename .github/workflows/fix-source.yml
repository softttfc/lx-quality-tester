name: Fix Merged Source

on:
  workflow_dispatch:
    inputs:
      file:
        description: 'merged-source-1789804624644.js'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run fix script
        run: |
          echo "::group::运行修复脚本"
          if [ -n "${{ inputs.file }}" ]; then
            node fix-merged-source.js "${{ inputs.file }}"
          else
            node fix-merged-source.js
          fi
          echo "::endgroup::"

      - name: Show output files
        run: |
          echo "::group::生成的文件"
          ls -la *.fixed.js 2>/dev/null || echo "（没有生成 .fixed.js）"
          echo "::endgroup::"

      - name: Upload fixed source as artifact
        uses: actions/upload-artifact@v4
        with:
          name: fixed-source
          path: '*.fixed.js'
          if-no-files-found: error
          retention-days: 30

      - name: Commit fixed source back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.fixed.js'
          if git diff --staged --quiet; then
            echo "没有需要提交的变更"
          else
            git commit -m "Auto-fix merged source [skip ci]"
            git push
          fi
